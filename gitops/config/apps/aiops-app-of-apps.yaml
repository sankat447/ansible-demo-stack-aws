# App-of-Apps — the ONLY manifest deploy.sh applies directly.
# It syncs this directory, which contains the child Applications
# (including itself — the standard self-managing pattern).
#
# Lesson L6: ArgoCD reverts hot-patches. Changes to anything under
# gitops/ take effect ONLY after commit + push to the tracked revision.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiops
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: aiops
spec:
  project: default
  source:
    repoURL: https://github.com/sankat447/ansible-demo-stack-aws.git
    targetRevision: main
    path: gitops/config/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
