---
# 🧠 Lightspeed Remediation Playbook Generator — Remediation workflow node 1.
# Generates the fix playbook from the human-reviewed prompt. Backend is
# the lightspeed service (Portkey → llama-3-1-8b by default, or the Red
# Hat Content Provider when configured — same URL either way).
- name: Generate a remediation playbook with Lightspeed
  hosts: localhost
  gather_facts: false
  vars:
    llm_endpoint: "{{ lightspeed_endpoint | default('http://lightspeed.aap.svc:8080') }}"
    llm_model: "{{ llm_model_name | default('llama-3-1-8b') }}"
    playbook_filename: "remediate-{{ incident_subject | default('demo-httpd') }}-{{ now(utc=true).strftime('%Y%m%d-%H%M%S') }}.yml"
  tasks:
    - name: Guard — a reviewed prompt is required
      ansible.builtin.assert:
        that:
          - lightspeed_prompt is defined
          - lightspeed_prompt | trim | length > 10
        fail_msg: No generation prompt — launch this template through its survey.

    - name: Generate the playbook
      ansible.builtin.uri:
        url: "{{ llm_endpoint }}/v1/chat/completions"
        method: POST
        body_format: json
        timeout: 300
        body:
          model: "{{ llm_model }}"
          max_tokens: 1500
          messages:
            - role: system
              content: >-
                You are Ansible Lightspeed. Produce ONLY a valid Ansible
                playbook in YAML (no prose, no markdown fences). Target:
                OpenShift via kubernetes.core modules, hosts: localhost,
                gather_facts: false. The playbook must be idempotent and
                include a verification task at the end.
            - role: user
              content: |
                {{ lightspeed_prompt }}
                Context: workload '{{ incident_subject | default('demo-httpd') }}'
                in namespace '{{ incident_namespace | default('aiops-demo-app') }}';
                its Apache config lives in ConfigMap 'demo-httpd-config'
                key 'demo.conf'. Root cause analysis:
                {{ incident_rca | default('n/a') | truncate(2000) }}
      register: generation

    - name: Extract playbook YAML (strip accidental fences)
      ansible.builtin.set_fact:
        generated_playbook: >-
          {{ generation.json.choices[0].message.content
             | regex_replace('^```(yaml)?\\s*', '')
             | regex_replace('```\\s*$', '') }}

    - name: Sanity-check that the output parses as YAML
      ansible.builtin.assert:
        that:
          - generated_playbook | from_yaml | type_debug == "list"
        fail_msg: >-
          Generated content is not a valid playbook — re-launch with a
          clearer prompt (this checkpoint exists precisely for that).

    - name: Save for the commit step
      ansible.builtin.copy:
        content: |
          ---
          # Generated by Ansible Lightspeed ({{ llm_model }})
          # Prompt: {{ lightspeed_prompt | trim | truncate(200) }}
          {{ generated_playbook }}
        dest: "/tmp/{{ playbook_filename }}"
        mode: "0644"

    - name: Publish artifacts to the workflow
      # Workflow nodes run in separate pods — the CONTENT is the
      # transport, not the /tmp file (that copy is just a job artifact
      # for humans to inspect).
      ansible.builtin.set_stats:
        data:
          generated_playbook_content: "{{ generated_playbook }}"
          generated_playbook_name: "{{ playbook_filename }}"
          lightspeed_prompt: "{{ lightspeed_prompt }}"
          incident_namespace: "{{ incident_namespace | default('aiops-demo-app') }}"
          incident_subject: "{{ incident_subject | default('demo-httpd') }}"
        per_host: false
